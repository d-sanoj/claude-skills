<title>Motion, as code</title>
<link rel="stylesheet" href="/runtime/film.css">
<style>
  /* The sine look: dark ink, cream text, one yellow wave. Colours are custom
     properties, so the editor can change them from film.json. */
  @font-face { font-family: "Josefin Sans"; src: url("/runtime/JosefinSans-VF.ttf") format("truetype"); font-weight: 100 700; }
  :root { --bg: #131313; --fg: #ebe8e1; --muted: #97948d; --accent: #f2c14e; --card: #1e1e1d; --blue: #c9dcee; }
  #stage { font-family: "Josefin Sans", system-ui, sans-serif; color: var(--fg); }
  .center { display: grid; place-content: center; text-align: center; gap: 28px; }
  h1 { font-size: 150px; font-weight: 700; margin: 0; letter-spacing: -2px; }
  .sub { font-size: 52px; color: var(--accent); margin: 0; font-weight: 600; }
  .wave { display: block; margin: 10px auto 0; }
  .steps { display: grid; gap: 40px; place-content: center; height: 100%; }
  .step { display: flex; gap: 36px; align-items: center; width: 1420px; background: var(--card);
    border: 2px solid #3c3c39; border-radius: 28px; padding: 40px 52px; font-size: 58px; font-weight: 600; }
  .step .n { color: var(--accent); font-weight: 700; }
  .close1 { font-size: 120px; font-weight: 700; margin: 0; }
  .close2 { font-size: 64px; color: var(--blue); margin: 0; font-weight: 600; }
</style>
</head>

<script type="module">
import { film } from "/runtime/player.js";

const spring = (bounce = 0.25, visualDuration = 0.6) => ({ type: "spring", bounce, visualDuration });

film({
  scenes: [
    { name: "Wake", duration: 2.5,
      play: () => [
        ["#title", { opacity: [0, 1], y: [40, 0] }, { ...spring(0.2), at: 0.2 }],
        ["#sub", { opacity: [0, 1], y: [24, 0] }, { ...spring(0.2), at: 0.5 }],
        ["#wave1", { opacity: [0, 1] }, { duration: 0.6, at: 0.9 }],
      ] },
    { name: "Idea", duration: 5,
      play: () => [
        ["#s1", { opacity: [0, 1], y: [60, 0] }, { ...spring(), at: 0.2 }],
        ["#s2", { opacity: [0, 1], y: [60, 0] }, { ...spring(), at: 1.4 }],
        ["#s3", { opacity: [0, 1], y: [60, 0] }, { ...spring(), at: 2.6 }],
      ] },
    { name: "Close", duration: 2.5,
      play: () => [
        ["#close1", { opacity: [0, 1], y: [40, 0] }, { ...spring(0.2), at: 0.2 }],
        ["#close2", { opacity: [0, 1], y: [24, 0] }, { ...spring(0.2), at: 0.6 }],
        ["#wave2", { opacity: [0, 1] }, { duration: 0.6, at: 0.9 }],
      ] },
  ],
});
</script>
